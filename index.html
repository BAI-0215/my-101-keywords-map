<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Mashiro Akihito - 3D Portfolio Map</title>
  <script src="//unpkg.com/3d-force-graph"></script>
  <script src="//unpkg.com/d3-color"></script>
  <style>
    body { margin: 0; background-color: #020202; color: white; font-family: sans-serif; overflow: hidden; }
    #info { position: absolute; top: 10px; left: 10px; z-index: 10; pointer-events: none; opacity: 0.7; font-size: 14px; }
  </style>
</head>
<body>
  <div id="info">中心：最大 / カテゴリ：中 / キーワード：小（淡色）</div>
  <div id="3d-graph"></div>

  <script>
    const dataSet = {
      main: "Mashiro Akihito",
      categories: [
        { name: "データ分析・技術", items: ["BigQuery", "GA4", "SQL", "Looker", "ダッシュボード作成", "LookMLチューニング", "データマート設計", "パイプライン構築", "一貫した実装"] },
        { name: "キャリア・ビジネス", items: ["社会インフラへの貢献", "ECコマース領域", "会計クラウドサービス", "長期的な価値提供", "一気通貫スタイル", "事業成長の加速", "転職・新たな挑戦", "業界の変革", "価値の最大化"] },
        { name: "AI・先端技術", items: ["AI技術の掛け合わせ", "業務自動化", "生成AI活用", "データドリブン", "最新テックトレンド", "プロトタイプ開発", "効率化の追求", "エンジニアリング", "AIとの共生"] },
        { name: "資産形成・投資", items: ["NVIDIA株", "株式投資", "NISA活用", "ポートフォリオ管理", "FP3級の勉強", "金融リテラシー", "経済ニュース", "資産の最適化", "リスク管理"] },
        { name: "ライフマネジメント", items: ["銀行名義変更", "各種手続きの完遂", "生活基盤の整理", "行政対応", "整理整頓", "宝くじの夢", "日常のタスク管理", "ライフイベント", "スケジュール最適化"] },
        { name: "健康・ライフスタイル", items: ["健康的な食事", "自炊習慣", "スキンケア", "美容へのこだわり", "メンタルヘルス", "モーニングルーティン", "睡眠の質の向上", "自己研鑽", "体調管理"] },
        { name: "エンタメ・趣味", items: ["AKB48", "B'z", "日本のポップカルチャー", "音楽鑑賞", "ライブへの情熱", "アイドル文化", "邦楽トレンド", "リラックスタイム", "多趣味な日常"] },
        { name: "専門的ソフトスキル", items: ["UI/UX改善", "ユーザー理解", "課題解決能力", "ロジカルシンキング", "プロジェクト管理", "ドキュメント作成", "プレゼンテーション", "チーム連携", "分析的思考"] },
        { name: "価値観・マインドセット", items: ["誠実な貢献", "自律的な行動", "高い好奇心", "柔軟な思考", "改善マインド", "プロフェッショナリズム", "本質志向", "持続可能な成長", "知的な探求"] },
        { name: "未来への展望", items: ["目標の達成", "スキルの成熟", "豊かな人生の構築", "安定と挑戦の両立", "新しいコミュニティ", "影響力の拡大", "幸福の追求", "未来の自分への投資", "次なるマイルストーン"] }
      ]
    };

    const nodes = [{ id: 0, name: dataSet.main, val: 50, level: 0, group: 0 }]; // mainは最大
    const links = [];

    dataSet.categories.forEach((cat, gIdx) => {
      const groupId = gIdx + 1;
      const categoryNodeId = `cat-${groupId}`;
      
      // カテゴリ：中サイズ
      nodes.push({ id: categoryNodeId, name: cat.name, val: 25, level: 1, group: groupId });
      links.push({ source: 0, target: categoryNodeId });

      // アイテム：小サイズ
      cat.items.forEach((item, iIdx) => {
        const itemId = `item-${groupId}-${iIdx}`;
        nodes.push({ id: itemId, name: item, val: 10, level: 2, group: groupId });
        links.push({ source: categoryNodeId, target: itemId });
      });
    });

    const Graph = ForceGraph3D()
      (document.getElementById('3d-graph'))
        .graphData({ nodes, links })
        .nodeLabel('name')
        .nodeVal(node => node.val) // valプロパティをサイズに反映
        .nodeAutoColorBy('group')
        .nodeColor(node => {
          // 色の濃淡調整
          const baseColor = d3.color(Graph.nodeColor()(node));
          if (node.level === 0) return '#ffffff'; // 中心は白で一番目立たせる
          if (node.level === 2) {
            baseColor.opacity = 0.4; // アイテムは透明度を上げて薄くする
            return baseColor.toString();
          }
          return baseColor.toString(); // カテゴリはそのままの色
        })
        .nodeRelSize(1) // nodeValとの兼ね合いで調整
        .linkOpacity(0.15)
        .linkWidth(0.5)
        .linkDirectionalParticles(2)
        .linkDirectionalParticleSpeed(0.004)
        .backgroundColor('#020202');

    Graph.d3Force('charge').strength(-200);
  </script>
</body>
</html>
