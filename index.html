<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Mashiro Akihito - Professional Universe</title>
  <script src="https://unpkg.com/3d-force-graph"></script>
  <style>
    body { margin: 0; background-color: #010101; overflow: hidden; font-family: "Helvetica Neue", Arial, sans-serif; }
    #guide { position: absolute; bottom: 20px; width: 100%; text-align: center; color: rgba(255,255,255,0.7); pointer-events: none; font-size: 14px; z-index: 30; font-weight: bold; }
    
    #labels-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
    .node-label {
      position: absolute;
      transform: translate(-50%, -50%);
      font-weight: bold;
      text-shadow: 0px 0px 5px #000, 0px 0px 10px #000;
      white-space: nowrap;
      transition: opacity 0.3s ease;
    }
    .label-level-0 { font-size: 36px; color: #ffffff; z-index: 3; }
    /* カテゴリの文字にカーソルを合わせるとポインターになるように設定 */
    .label-level-1 { font-size: 20px; z-index: 2; cursor: pointer; } 
    /* itemsの文字色を白に指定 */
    .label-level-2 { font-size: 14px; z-index: 1; color: #ffffff; } 
  </style>
</head>
<body>
  <div id="guide">カテゴリ（球体または文字）をクリックで【詳細展開】 / 背景の黒い部分をクリックで【全体表示】に戻る</div>
  <div id="3d-graph"></div>
  <div id="labels-container"></div>

  <script>
    const dataSet = {
      main: "Mashiro Akihito",
      categories: [
        { name: "データ分析・技術", items: ["BigQuery", "GA4", "SQL", "Looker", "ダッシュボード作成", "LookMLチューニング", "データマート設計", "パイプライン構築", "一貫した実装", "統計学"] },
        { name: "キャリア・ビジネス", items: ["社会インフラへの貢献", "ECコマース領域", "会計クラウドサービス", "長期的な価値提供", "一気通貫スタイル", "事業成長の加速", "転職・新たな挑戦", "業界の変革", "価値の最大化", "リーダーシップ"] },
        { name: "AI・先端技術", items: ["AI技術の掛け合わせ", "業務自動化", "生成AI活用", "データドリブン", "最新テックトレンド", "プロトタイプ開発", "効率化の追求", "エンジニアリング", "AIとの共生", "ディープラーニング"] },
        { name: "資産形成・投資", items: ["NVIDIA株", "株式投資", "NISA活用", "ポートフォリオ管理", "FP3級の勉強", "金融リテラシー", "経済ニュース", "資産の最適化", "リスク管理", "ふるさと納税"] },
        { name: "ライフマネジメント", items: ["銀行名義変更", "各種手続きの完遂", "生活基盤の整理", "行政対応", "整理整頓", "宝くじの夢", "日常のタスク管理", "ライフイベント", "スケジュール最適化", "パスワード管理"] },
        { name: "健康・ライフスタイル", items: ["健康的な食事", "自炊習慣", "スキンケア", "美容へのこだわり", "メンタルヘルス", "モーニングルーティン", "睡眠の質の向上", "自己研鑽", "体調管理", "マインドフルネス"] },
        { name: "エンタメ・趣味", items: ["AKB48", "B'z", "日本のポップカルチャー", "音楽鑑賞", "ライブへの情熱", "アイドル文化", "邦楽トレンド", "リラックスタイム", "多趣味な日常", "映画鑑賞"] },
        { name: "専門的ソフトスキル", items: ["UI/UX改善", "ユーザー理解", "課題解決能力", "ロジカルシンキング", "プロジェクト管理", "ドキュメント作成", "プレゼンテーション", "チーム連携", "分析的思考", "交渉力"] },
        { name: "価値観・マインドセット", items: ["誠実な貢献", "自律的な行動", "高い好奇心", "柔軟な思考", "改善マインド", "プロフェッショナリズム", "本質志向", "持続可能な成長", "知的な探求", "継続力"] },
        { name: "未来への展望", items: ["目標の達成", "スキルの成熟", "豊かな人生の構築", "安定と挑戦の両立", "新しいコミュニティ", "影響力の拡大", "幸福の追求", "未来の自分への投資", "次なるマイルストーン", "社会貢献", "新たなステージ"] }
      ]
    };

    const nodes = [{ id: "root", name: dataSet.main, val: 120, level: 0, color: "#ffffff" }];
    const links = [];
    const colors = ["#FF3366", "#33FF99", "#3366FF", "#FFCC33", "#FF66FF", "#33FFFF", "#FFA500", "#9966FF", "#CCFF33", "#FF4500"];

    dataSet.categories.forEach((cat, gIdx) => {
      const catId = `cat-${gIdx}`;
      const groupColor = colors[gIdx % colors.length];
      nodes.push({ id: catId, name: cat.name, val: 60, level: 1, color: groupColor, parentId: "root" });
      links.push({ source: "root", target: catId });

      cat.items.forEach((item, iIdx) => {
        const itemId = `item-${gIdx}-${iIdx}`;
        nodes.push({ id: itemId, name: item, val: 15, level: 2, color: groupColor, parentId: catId });
        links.push({ source: catId, target: itemId });
      });
    });

    const labelsContainer = document.getElementById('labels-container');
    const labelElements = {};
    let activeCategory = null;

    // ★ 共通のカテゴリ展開処理（球体クリックでも文字クリックでもここを呼び出す）
    function focusOnCategory(node) {
      if (node.level !== 1) return;
      
      activeCategory = node.id;
      updateVisibility();
      
      node.fx = 0;
      node.fy = 0;
      node.fz = 0;

      const childItems = nodes.filter(n => n.parentId === activeCategory);
      const radius = 180;
      const angleStep = (2 * Math.PI) / childItems.length;
      
      childItems.forEach((item, idx) => {
        item.fx = radius * Math.cos(idx * angleStep);
        item.fy = radius * Math.sin(idx * angleStep);
        item.fz = 0; 
      });

      Graph.cameraPosition({ x: 0, y: 0, z: 450 }, { x: 0, y: 0, z: 0 }, 1000);
    }

    // テキスト要素の生成
    nodes.forEach(node => {
      const div = document.createElement('div');
      div.className = `node-label label-level-${node.level}`;
      div.innerText = node.name;
      
      // カテゴリだけ色をつけ、itemsは白（CSSまたはここで指定）
      if (node.level === 1) {
        div.style.color = node.color;
        // ★ カテゴリの文字をクリックした時の処理を追加
        div.addEventListener('click', (e) => {
          e.stopPropagation(); // 背景クリックと重複しないようにする
          focusOnCategory(node);
        });
      } else if (node.level === 2) {
        div.style.color = "#ffffff"; // ★ itemsを白に固定
      }
      
      labelsContainer.appendChild(div);
      labelElements[node.id] = div;
    });

    const Graph = ForceGraph3D()(document.getElementById('3d-graph'))
      .graphData({ nodes, links })
      .nodeColor('color')
      .nodeVal('val')
      .nodeOpacity(0.9)
      .linkOpacity(0.15)
      .backgroundColor('#010101')
      .showNavInfo(false)
      
      // ★ 球体をクリックした時も共通処理を呼ぶ
      .onNodeClick(node => {
        focusOnCategory(node);
      })
      
      .onBackgroundClick(() => {
        if (activeCategory !== null) {
          activeCategory = null;
          updateVisibility();
          setInitialLayout();
          Graph.cameraPosition({ x: 0, y: 0, z: 1000 }, { x: 0, y: 0, z: 0 }, 1000);
        }
      });

    // 初期状態のレイアウト固定（円状）
    function setInitialLayout() {
      Graph.d3Force('charge').strength(0);
      Graph.d3Force('link').distance(0);

      const mainNode = nodes.find(n => n.id === "root");
      mainNode.fx = 0;
      mainNode.fy = 0;
      mainNode.fz = 0;

      const categoryNodes = nodes.filter(n => n.level === 1);
      const radius = 300; 
      const angleStep = (2 * Math.PI) / categoryNodes.length;

      categoryNodes.forEach((node, idx) => {
        node.fx = radius * Math.cos(idx * angleStep);
        node.fy = radius * Math.sin(idx * angleStep);
        node.fz = 0;
      });
    }

    setInitialLayout();
    updateVisibility();
    Graph.cameraPosition({ z: 1000 });

    // 表示・非表示の切り替え
    function updateVisibility() {
      Graph.nodeVisibility(node => {
        if (!activeCategory) return node.level < 2; 
        return node.id === activeCategory || node.parentId === activeCategory;
      });
      
      Graph.linkVisibility(link => {
        if (!activeCategory) {
          const targetId = link.target.id || link.target;
          return nodes.find(n => n.id === targetId)?.level === 1;
        }
        const sourceId = link.source.id || link.source;
        return sourceId === activeCategory;
      });
    }

    // 文字ラベルの追従処理
    function updateLabels() {
      nodes.forEach(node => {
        const el = labelElements[node.id];
        if (el && node.x !== undefined) {
          
          let isVisible = true;
          if (!activeCategory) {
             if(node.level === 2) isVisible = false;
          } else {
            if (node.id === "root") {
              isVisible = false; 
            } else if (node.id !== activeCategory && node.parentId !== activeCategory) {
              isVisible = false; 
            }
          }

          const coords = Graph.graph2ScreenCoords(node.x, node.y, node.z);
          if (!isVisible || coords.z < 0 || coords.z > 1) {
            el.style.opacity = 0;
            el.style.pointerEvents = 'none';
          } else {
            // ★ 文字が常にはっきり見えるように opacity を調整
            el.style.opacity = 1; 
            el.style.pointerEvents = 'auto'; // クリック判定を有効にする
            el.style.left = `${coords.x}px`;
            const yOffset = node.level === 0 ? 40 : (node.level === 1 ? 25 : 12);
            el.style.top = `${coords.y - yOffset}px`;
          }
        }
      });
      requestAnimationFrame(updateLabels);
    }
    requestAnimationFrame(updateLabels);
  </script>
</body>
</html>
