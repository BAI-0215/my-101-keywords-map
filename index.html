<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Mashiro Akihito - Professional Universe</title>
  <script src="https://unpkg.com/3d-force-graph"></script>
  <style>
    body { margin: 0; background-color: #010101; overflow: hidden; font-family: "Helvetica Neue", Arial, sans-serif; }
    /* ★ 修正1: ガイドのテキストを左上に移動し、左揃えに変更。2段表示用にline-heightを追加 */
    #guide { position: absolute; top: 20px; left: 20px; text-align: left; color: rgba(255,255,255,0.7); pointer-events: none; font-size: 14px; z-index: 30; font-weight: bold; text-shadow: 0px 0px 5px #000; line-height: 1.6; }
    
    #labels-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
    .node-label {
      position: absolute;
      transform: translate(-50%, -50%);
      font-weight: bold;
      text-shadow: 0px 0px 5px #000, 0px 0px 10px #000;
      white-space: nowrap;
      /* ★ 修正3用: transform のアニメーションを追加 */
      transition: opacity 0.3s ease, transform 0.2s ease;
    }
    .label-level-0 { font-size: 36px; color: #ffffff; z-index: 3; }
    /* カテゴリの文字にカーソルを合わせるとポインターになるように設定 */
    .label-level-1 { font-size: 20px; z-index: 2; cursor: pointer; } 
    /* itemsの文字色を白に指定 */
    .label-level-2 { font-size: 14px; z-index: 1; color: #ffffff; cursor: pointer; } 
    
    /* ★ 修正: itemsの文字または球体にホバーした際に拡大するスタイルを追加 */
    .label-level-2:not(.item-centered):hover,
    .label-level-2:not(.item-centered).hovered { transform: translate(-50%, -50%) scale(1.6); z-index: 15; }

    /* itemsページ（3ページ目）用のスタイル追加 */
    #item-overlay {
      position: fixed;
      width: 300vmax;
      height: 300vmax;
      border-radius: 50%;
      transform: translate(-50%, -50%) scale(0);
      transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1);
      z-index: 5; /* ★ 20から5に変更。文字のコンテナ(z-index:10)より下に配置する */
      pointer-events: none;
    }
    #item-overlay.active {
      transform: translate(-50%, -50%) scale(1);
      pointer-events: auto;
      cursor: pointer;
    }
    .node-label.item-centered {
      left: 50% !important;
      top: 50% !important;
      transform: translate(-50%, -50%) scale(3) !important; /* 文字を大きく見せる */
      z-index: 25 !important;
      transition: all 0.8s cubic-bezier(0.25, 1, 0.5, 1) !important;
    }
  </style>
</head>
<body>
  <div id="item-overlay"></div>
  <div id="guide">カテゴリをクリックで詳細を展開できる。<br>背景の黒い部分をクリックで前のページに戻る。</div>
  <div id="3d-graph"></div>
  <div id="labels-container"></div>

  <script>
    const dataSet = {
      main: "Mashiro Akihito",
      categories: [
        {
          name: "日本に来る前とそれから",
          items: ["そうだ 日本、行こう", "親の反対", "試験への挑戦", "日本の匂い", "憧れが「日常」に変わった日", "外国語を使うのって楽しい", "突然の花粉症", "早稲田祭", "東京の人になった", "歯が高い", "宝くじ"]
        },
        {
          name: "知的好奇心・向上心",
          items: ["知りたい欲", "情報を浴びる習慣", "独学", "努力タイプ", "知識のつまみ食い", "「点」と「点」が繋がる瞬間の快感", "「分からない」を放置できない", "まずは触ってみる「バイブ・ラーニング」", "AIと仲良くなりたい", "本と対話する", "3万円のAIコース"]
        },
        {
          name: "キャリア",
          items: ["海外サービス", "国内サービス", "データ基盤の構築", "データ分析・検証", "デザイン", "UI改善", "ABテスト", "上流から下流", "コミュニティマネジメント", "フィリピン", "多言語（日英中）"]
        },
        {
          name: "マイジャパンニーズセンセイ",
          items: ["浜崎あゆみ", "AKB48", "乃木坂46", "FRUITS ZIPPER", "ジャニーズ", "Mrs. GREEN APPLE", "JPOP", "バラエティー", "ドラマ", "アニメ", "ニコニコ生放送", "Youtube", "TikTok", "SmartNews"]
        },
        {
          name: "経験のあること",
          items: ["GA4・GTM", "Looker", "LookML", "BigQuery・SQL", "Looker Studio", "Figma", "HTML・CSS", "バイブコーディングで形にする", "マルチタスク", "語学力", "他部署連携"]
        },
        {
          name: "興味のあること",
          items: ["PIVOT", "不動産Gメン滝島", "株投資チャンネル", "国際政治・経済", "毎日のニュース", "AI活用・AI Agent", "旅行", "グルメ巡り", "恋愛リアリティショー", "街行く探検隊", "肌ケア・アンチエイジング・腸活", "アイドル", "宇宙"]
        },
        {
          name: "矛盾した性格",
          items: ["好奇心旺盛", "興味のスイッチが明確", "凝り性・集中力", "努力家・怠け者", "新しもの好き", "慎重・優柔不断", "悲観的・楽観的", "陽気な隠れ内向型", "共感力あり", "相手を尊重", "頑固な一面", "論理重視・根拠重視", "感情的・直感的", "ある意味前例主義", "過去より未来"]
        },
        {
          name: "働き方と対人スタンス",
          items: ["自走力あり", "自分のペースで仕事をこなす", "知らない領域への探求心", "責任感が強い", "品質重視", "クリエイティブ", "スペシャリストよりジェネラリスト", "観察してから行動する", "論理と直感の往復", "相手の立場で物事を考える", "オープンな情報共有", "他者へのリスペクト", "高圧への静かな拒絶", "一貫した判断基準を重視", "自由と非強要"]
        }
      ]
    };

    // ★ 修正2: メインのノードの val を 120 から 180（1.5倍）に変更
    const nodes = [{ id: "root", name: dataSet.main, val: 180, level: 0, color: "#ffffff" }];
    const links = [];
    const colors = ["#FF3366", "#33FF99", "#3366FF", "#FFCC33", "#FF66FF", "#33FFFF", "#FFA500", "#9966FF", "#CCFF33", "#FF4500"];

    dataSet.categories.forEach((cat, gIdx) => {
      const catId = `cat-${gIdx}`;
      const groupColor = colors[gIdx % colors.length];
      nodes.push({ id: catId, name: cat.name, val: 60, level: 1, color: groupColor, parentId: "root" });
      links.push({ source: "root", target: catId });

      cat.items.forEach((item, iIdx) => {
        const itemId = `item-${gIdx}-${iIdx}`;
        nodes.push({ id: itemId, name: item, val: 15, level: 2, color: groupColor, parentId: catId });
        links.push({ source: catId, target: itemId });
      });
    });

    const labelsContainer = document.getElementById('labels-container');
    const labelElements = {};
    let activeCategory = null;
    let activeItem = null; // ★ 3ページ目（itemsページ）用の状態管理を追加

    // ★ 新規追加: 回転アニメーション用の状態管理
    let baseAngle = 0;
    let isCanvasNodeHovered = false; // 3D球体上のホバー状態
    let isLabelHovered = false;      // 文字(HTML)上のホバー状態
    let hoveredNodeId = null;        // ★ 追加: 現在ホバーされている球体のノードID

    // ★ items（3ページ目）展開処理
    function focusOnItem(node) {
      if (node.level !== 2) return;
      activeItem = node;
      
      const overlay = document.getElementById('item-overlay');
      const coords = Graph.graph2ScreenCoords(node.x, node.y, node.z);
      
      // クリックした球体の位置から背景が広がるように初期位置を設定
      overlay.style.backgroundColor = node.color;
      overlay.style.left = `${coords.x}px`;
      overlay.style.top = `${coords.y}px`;
      
      // ブラウザにスタイルの変更を即座に反映させる（リフロー）
      void overlay.offsetWidth;
      
      overlay.classList.add('active');
      
      // 文字を中央へアニメーションさせるクラスを付与
      const el = labelElements[node.id];
      el.classList.add('item-centered');
      
      // テキスト変更（改行等を含めるためinnerHTMLを使用）
      document.getElementById('guide').innerHTML = "画面をクリックで前のページに戻る。";
    }

    // ★ itemsページから戻る処理
    function closeItemView() {
      if (!activeItem) return;
      
      const overlay = document.getElementById('item-overlay');
      overlay.classList.remove('active');
      
      const el = labelElements[activeItem.id];
      el.classList.remove('item-centered');
      
      activeItem = null;
      // 元のテキストに戻す
      document.getElementById('guide').innerHTML = "カテゴリをクリックで詳細を展開できる。<br>背景の黒い部分をクリックで前のページに戻る。";
    }

    // 背景（オーバーレイ）クリックで戻る
    document.getElementById('item-overlay').addEventListener('click', closeItemView);

    // ★ 共通のカテゴリ展開処理（球体クリックでも文字クリックでもここを呼び出す）
    function focusOnCategory(node) {
      if (node.level !== 1) return;
      
      activeCategory = node.id;
      updateVisibility();
      
      // 一旦すべてのノードの固定を解除し、座標のキャッシュによるバグを防ぐ
      nodes.forEach(n => {
        n.fx = undefined; n.fy = undefined; n.fz = undefined;
      });

      node.fx = 0;
      node.fy = 0;
      node.fz = 0;
      node.x = 0;
      node.y = 0;
      node.z = 0;

      const childItems = nodes.filter(n => n.parentId === activeCategory);
      const radius = 180;
      const angleStep = (2 * Math.PI) / childItems.length;
      
      childItems.forEach((item, idx) => {
        item.fx = radius * Math.cos(idx * angleStep);
        item.fy = radius * Math.sin(idx * angleStep);
        item.fz = 0; 
        item.x = item.fx;
        item.y = item.fy;
        item.z = item.fz;
      });

      Graph.cameraPosition({ x: 0, y: 0, z: 450 }, { x: 0, y: 0, z: 0 }, 1000);
    }

    // テキスト要素の生成
    nodes.forEach(node => {
      const div = document.createElement('div');
      div.className = `node-label label-level-${node.level}`;
      div.innerText = node.name;
      
      // ★ 新規追加: 文字上のマウスホバーで回転を停止させる
      if (node.level === 0 || node.level === 1) {
        div.addEventListener('mouseenter', () => isLabelHovered = true);
        div.addEventListener('mouseleave', () => isLabelHovered = false);
      }

      // カテゴリだけ色をつけ、itemsは白（CSSまたはここで指定）
      if (node.level === 1) {
        div.style.color = node.color;
        // ★ カテゴリの文字をクリックした時の処理を追加
        div.addEventListener('click', (e) => {
          e.stopPropagation(); // 背景クリックと重複しないようにする
          if (activeItem) return; // itemsページ展開中は無効化
          focusOnCategory(node);
        });
      } else if (node.level === 2) {
        div.style.color = "#ffffff"; // ★ itemsを白に固定
        // ★ itemsの文字をクリックした時の処理を追加
        div.addEventListener('click', (e) => {
          e.stopPropagation();
          if (activeItem && activeItem.id === node.id) {
            closeItemView();
          } else if (!activeItem) {
            focusOnItem(node);
          }
        });
      }
      
      labelsContainer.appendChild(div);
      labelElements[node.id] = div;
    });

    const Graph = ForceGraph3D()(document.getElementById('3d-graph'))
      .graphData({ nodes, links })
      .nodeColor('color')
      .nodeVal('val')
      .nodeOpacity(0.9)
      .linkOpacity(0.15)
      .backgroundColor('#010101')
      .showNavInfo(false)
      // ★ 修正4: マウスホバー時にデフォルトで表示されるツールチップ（文字）を非表示にする
      .nodeLabel(() => null)
      
      // ★ 新規追加: アニメーションを永続化（エラーの原因であった再起動処理を排除するため）
      .d3AlphaDecay(0)

      // ★ 新規追加: 3D球体上のマウスホバーで回転を停止させる・球体のホバー状態を保存する
      .onNodeHover(node => {
        isCanvasNodeHovered = !!node; // nodeが存在すればtrue、なければfalse
        hoveredNodeId = node ? node.id : null; // ★ 追加: どの球体にホバーしているかを保存
      })
      
      // ★ 球体をクリックした時も共通処理を呼ぶ
      .onNodeClick(node => {
        if (activeItem) return; // itemsページ展開中は無効化
        if (node.level === 1) {
          focusOnCategory(node);
        } else if (node.level === 2) {
          focusOnItem(node);
        }
      })
      
      .onBackgroundClick(() => {
        if (activeCategory !== null) {
          activeCategory = null;
          updateVisibility();
          setInitialLayout();
          Graph.cameraPosition({ x: 0, y: 0, z: 1000 }, { x: 0, y: 0, z: 0 }, 1000);
          // ★ 修正: 前のページに戻った瞬間に、物理エンジンを再始動して回転を再開させる
          Graph.d3ReheatSimulation();
        }
      });

    // 初期状態のレイアウト固定（円状）
    function setInitialLayout() {
      Graph.d3Force('charge').strength(0);
      Graph.d3Force('link').distance(0);

      // 一旦すべてのノードの固定を解除
      nodes.forEach(n => {
        n.fx = undefined; n.fy = undefined; n.fz = undefined;
      });

      const mainNode = nodes.find(n => n.id === "root");
      mainNode.fx = 0;
      mainNode.fy = 0;
      mainNode.fz = 0;
      mainNode.x = 0;
      mainNode.y = 0;
      mainNode.z = 0;

      const categoryNodes = nodes.filter(n => n.level === 1);
      const radius = 300; 
      const angleStep = (2 * Math.PI) / categoryNodes.length;

      categoryNodes.forEach((node, idx) => {
        // 固定された角度ではなく、現在回転している baseAngle を利用して配置する
        const currentAngle = baseAngle + idx * angleStep; 
        node.fx = radius * Math.cos(currentAngle);
        node.fy = radius * Math.sin(currentAngle);
        node.fz = 0;
        node.x = node.fx;
        node.y = node.fy;
        node.z = node.fz;
      });
    }

    setInitialLayout();
    updateVisibility();
    Graph.cameraPosition({ z: 1000 });

    // 表示・非表示の切り替え
    function updateVisibility() {
      Graph.nodeVisibility(node => {
        if (!activeCategory) return node.level < 2; 
        return node.id === activeCategory || node.parentId === activeCategory;
      });
      
      Graph.linkVisibility(link => {
        if (!activeCategory) {
          const targetId = link.target.id || link.target;
          return nodes.find(n => n.id === targetId)?.level === 1;
        }
        const sourceId = link.source.id || link.source;
        return sourceId === activeCategory;
      });
    }

    // 文字ラベルの追従処理
    function updateLabels() {
      // mainページで、マウスが乗っていない時だけ全体を時計回りに回転させる処理
      if (activeCategory === null && !activeItem && !isCanvasNodeHovered && !isLabelHovered) {
        baseAngle -= 0.0015; // マイナス値で時計回り。数値を大きくすると速くなります
        
        const categoryNodes = nodes.filter(n => n.level === 1);
        const radius = 300;
        const angleStep = (2 * Math.PI) / categoryNodes.length;

        categoryNodes.forEach((node, idx) => {
          const currentAngle = baseAngle + idx * angleStep;
          node.fx = radius * Math.cos(currentAngle);
          node.fy = radius * Math.sin(currentAngle);
          // .d3AlphaDecay(0) によってエンジンが稼働し続けているため、
          // fx, fy を変更するだけで自動的に球体が移動します。
        });
      }

      nodes.forEach(node => {
        const el = labelElements[node.id];
        if (el && node.x !== undefined) {
          
          // ★ itemsページ表示時のラベル制御
          if (activeItem) {
            if (node.id === activeItem.id) {
              el.style.opacity = 1;
              el.style.pointerEvents = 'auto';
            } else {
              el.style.opacity = 0;
              el.style.pointerEvents = 'none';
            }
            return; // CSSアニメーションで中央に固定されるので、座標更新はスキップ
          }

          let isVisible = true;
          if (!activeCategory) {
             if(node.level === 2) isVisible = false;
          } else {
            if (node.id === "root") {
              isVisible = false; 
            } else if (node.id !== activeCategory && node.parentId !== activeCategory) {
              isVisible = false; 
            }
          }

          const coords = Graph.graph2ScreenCoords(node.x, node.y, node.z);
          if (!isVisible || coords.z < 0 || coords.z > 1) {
            el.style.opacity = 0;
            el.style.pointerEvents = 'none';
          } else {
            // ★ 文字が常にはっきり見えるように opacity を調整
            el.style.opacity = 1; 
            el.style.pointerEvents = 'auto'; // クリック判定を有効にする
            el.style.left = `${coords.x}px`;
            
            // ★ 修正: 2ページ目の展開中カテゴリ (activeCategory) は文字を球体の中央(yOffset=0)に配置する
            let yOffset = 0;
            if (node.level === 0) {
              yOffset = 40;
            } else if (node.level === 1) {
              yOffset = (activeCategory === node.id) ? 0 : 25;
            } else if (node.level === 2) {
              yOffset = 12;
            }
            el.style.top = `${coords.y - yOffset}px`;

            // ★ 追加: 球体にホバーしている時も文字を拡大するためのクラス付与
            if (hoveredNodeId === node.id && node.level === 2) {
              el.classList.add('hovered');
            } else {
              el.classList.remove('hovered');
            }
          }
        }
      });
      requestAnimationFrame(updateLabels);
    }
    requestAnimationFrame(updateLabels);
  </script>
</body>
</html>
