<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Mashiro Akihito - Professional Universe</title>
  <script src="https://unpkg.com/3d-force-graph"></script>
  <style>
    body { margin: 0; background-color: #010101; overflow: hidden; font-family: "Helvetica Neue", Arial, sans-serif; }
    
    /* --- 修正2: ガイドを左上に移動 --- */
    #guide {
      position: absolute;
      top: 20px;
      left: 20px;
      text-align: left;
      color: rgba(255,255,255,0.7);
      pointer-events: none;
      font-size: 14px;
      z-index: 30;
      font-weight: bold;
      line-height: 1.5;
    }

    /* --- 新機能: 全画面背景色オーバーレイ --- */
    #fullscreen-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 5; /* 3Dグラフより上、文字より下 */
      opacity: 0;
      /* 中心から円形に広がるアニメーション */
      clip-path: circle(0% at center);
      transition: clip-path 0.8s cubic-bezier(0.23, 1, 0.32, 1), opacity 0.3s ease;
      pointer-events: none;
    }
    /* アクティブになった時のスタイル */
    #fullscreen-overlay.active {
      opacity: 1;
      clip-path: circle(150% at center); /* 画面外まで広げて覆い尽くす */
      pointer-events: auto; /* 背景クリックでの「戻る」を受け付ける */
    }

    #labels-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
    
    .node-label {
      position: absolute;
      transform: translate(-50%, -50%) scale(1);
      font-weight: bold;
      text-shadow: 0px 0px 6px #000, 0px 0px 12px #000;
      white-space: nowrap;
      transition: opacity 0.3s ease, transform 0.3s ease;
      pointer-events: auto;
      cursor: pointer;
    }
    
    /* --- 修正4: 文字サイズをアップ --- */
    .label-level-0 { font-size: 48px; color: #ffffff; z-index: 3; }
    
    .label-level-1 { font-size: 24px; z-index: 2; } /* 22px -> 24px */
    .label-level-1:hover { transform: translate(-50%, -50%) scale(1.3); }
    
    .label-level-2 { font-size: 18px; z-index: 1; color: #ffffff; } /* 14px -> 18px */
    .label-level-2:hover { transform: translate(-50%, -50%) scale(1.6); color: #ffffaa !important; }

    /* アイテム単体表示時の文字スタイル */
    .focused-item {
      transform: translate(-50%, -50%) scale(3.5) !important;
      color: #ffffff !important;
      /* 背景が明るくなるので、影を強くして可読性を確保 */
      text-shadow: 0px 0px 30px rgba(0, 0, 0, 1), 0px 0px 15px #000, 0px 0px 5px #000;
      z-index: 100;
    }
  </style>
</head>
<body>
  <div id="guide">文字/球体クリックで【深掘り】<br>背景クリックで【1つ戻る】</div>
  <div id="fullscreen-overlay"></div>
  <div id="3d-graph"></div>
  <div id="labels-container"></div>

  <script>
    const dataSet = {
      main: "Mashiro Akihito",
      categories: [
        { name: "データ分析・技術", items: ["BigQuery", "GA4", "SQL", "Looker", "ダッシュボード作成", "LookMLチューニング", "データマート設計", "パイプライン構築", "一貫した実装", "統計学"] },
        { name: "キャリア・ビジネス", items: ["社会インフラへの貢献", "ECコマース領域", "会計クラウドサービス", "長期的な価値提供", "一気通貫スタイル", "事業成長の加速", "転職・新たな挑戦", "業界の変革", "価値の最大化", "リーダーシップ"] },
        { name: "AI・先端技術", items: ["AI技術の掛け合わせ", "業務自動化", "生成AI活用", "データドリブン", "最新テックトレンド", "プロトタイプ開発", "効率化の追求", "エンジニアリング", "AIとの共生", "ディープラーニング"] },
        { name: "資産形成・投資", items: ["NVIDIA株", "株式投資", "NISA活用", "ポートフォリオ管理", "FP3級の勉強", "金融リテラシー", "経済ニュース", "資産の最適化", "リスク管理", "ふるさと納税"] },
        { name: "ライフマネジメント", items: ["銀行名義変更", "各種手続きの完遂", "生活基盤の整理", "行政対応", "整理整頓", "宝くじの夢", "日常のタスク管理", "ライフイベント", "スケジュール最適化", "パスワード管理"] },
        { name: "健康・ライフスタイル", items: ["健康的な食事", "自炊習慣", "スキンケア", "美容へのこだわり", "メンタルヘルス", "モーニングルーティン", "睡眠の質の向上", "自己研鑽", "体調管理", "マインドフルネス"] },
        { name: "エンタメ・趣味", items: ["AKB48", "B'z", "日本のポップカルチャー", "音楽鑑賞", "ライブへの情熱", "アイドル文化", "邦楽トレンド", "リラックスタイム", "多趣味な日常", "映画鑑賞"] },
        { name: "専門的ソフトスキル", items: ["UI/UX改善", "ユーザー理解", "課題解決能力", "ロジカルシンキング", "プロジェクト管理", "ドキュメント作成", "プレゼンテーション", "チーム連携", "分析的思考", "交渉力"] },
        { name: "価値観・マインドセット", items: ["誠実な貢献", "自律的な行動", "高い好奇心", "柔軟な思考", "改善マインド", "プロフェッショナリズム", "本質志向", "持続可能な成長", "知的な探求", "継続力"] },
        { name: "未来への展望", items: ["目標の達成", "スキルの成熟", "豊かな人生の構築", "安定と挑戦の両立", "新しいコミュニティ", "影響力の拡大", "幸福の追求", "未来の自分への投資", "次なるマイルストーン", "社会貢献", "新たなステージ"] }
      ]
    };

    // --- 修正4: 球体サイズをアップ ---
    const nodes = [{ id: "root", name: dataSet.main, val: 400, level: 0, color: "#ffffff" }];
    const links = [];
    const colors = ["#FF3366", "#33FF99", "#3366FF", "#FFCC33", "#FF66FF", "#33FFFF", "#FFA500", "#9966FF", "#CCFF33", "#FF4500"];

    dataSet.categories.forEach((cat, gIdx) => {
      const catId = `cat-${gIdx}`;
      const groupColor = colors[gIdx % colors.length];
      // val: 60 -> 80
      nodes.push({ id: catId, name: cat.name, val: 80, level: 1, color: groupColor, parentId: "root" });
      links.push({ source: "root", target: catId });

      cat.items.forEach((item, iIdx) => {
        const itemId = `item-${gIdx}-${iIdx}`;
        // val: 20 -> 30
        nodes.push({ id: itemId, name: item, val: 30, level: 2, color: groupColor, parentId: catId });
        links.push({ source: catId, target: itemId });
      });
    });

    const labelsContainer = document.getElementById('labels-container');
    const overlay = document.getElementById('fullscreen-overlay'); // オーバーレイ要素を取得
    const labelElements = {};
    
    let activeCategory = null; 
    let activeItem = null;     

    // --- 各種展開アクション ---

    // 1. カテゴリ展開（2D円状）
    function focusOnCategory(node) {
      if (node.level !== 1 || activeItem) return;
      activeCategory = node.id;
      updateVisibility();
      
      node.fx = 0; node.fy = 0; node.fz = 0;

      const childItems = nodes.filter(n => n.parentId === activeCategory);
      const radius = 250; // 半径も少し大きく
      const angleStep = (2 * Math.PI) / childItems.length;
      
      childItems.forEach((item, idx) => {
        item.fx = radius * Math.cos(idx * angleStep);
        item.fy = radius * Math.sin(idx * angleStep);
        item.fz = 0; 
      });

      // --- 修正1 & 3: カメラ位置と注視点の修正 ---
      // 距離を1200 -> 1600に離して見切れを防止
      // 第二引数に {x:0, y:0, z:0} を指定し、必ず中心を見るように矯正
      Graph.cameraPosition({ x: 0, y: 0, z: 1600 }, { x: 0, y: 0, z: 0 }, 1000);
    }

    // 2. アイテム単体展開（全画面背景演出）
    function focusOnItem(node) {
      if (node.level !== 2) return;
      activeItem = node.id;
      updateVisibility();

      // --- 修正5: 全画面背景演出の実行 ---
      overlay.style.backgroundColor = node.color; // 選んだアイテムの色をセット
      overlay.classList.add('active'); // アニメーション開始

      // --- 修正1 & 5: カメラ位置の修正 ---
      // 注視点を指定して中央に捉える。距離は少し離す(1000->1200)
      Graph.cameraPosition({ x: 0, y: 0, z: 1200 }, { x: 0, y: 0, z: 0 }, 1000);
    }

    // 3. アイテム単体から「戻る」処理
    function goBackFromItem() {
      activeItem = null;
      updateVisibility();

      // --- 修正5: 全画面演出の解除 ---
      overlay.classList.remove('active');
      // 色がパッと消えないように少し待ってからリセット（任意）
      setTimeout(() => { overlay.style.backgroundColor = 'transparent'; }, 800);

      const categoryNode = nodes.find(n => n.id === activeCategory);
      focusOnCategory(categoryNode);
    }

    // --- HTMLラベルの生成 ---
    nodes.forEach(node => {
      const div = document.createElement('div');
      div.className = `node-label label-level-${node.level}`;
      div.innerText = node.name;
      
      if (node.level === 1) {
        div.style.color = node.color;
        div.addEventListener('click', (e) => { e.stopPropagation(); focusOnCategory(node); });
      } else if (node.level === 2) {
        div.style.color = "#ffffff"; 
        div.addEventListener('click', (e) => { 
          e.stopPropagation(); 
          if (activeItem === node.id) goBackFromItem();
          else focusOnItem(node);
        });
      }
      labelsContainer.appendChild(div);
      labelElements[node.id] = div;
    });

    // --- 3Dグラフの設定 ---
    const Graph = ForceGraph3D()(document.getElementById('3d-graph'))
      .graphData({ nodes, links })
      .nodeColor('color')
      .nodeVal('val')
      .nodeOpacity(0.95)
      .linkOpacity(0.15)
      .backgroundColor('#010101')
      .showNavInfo(false)
      
      .onNodeClick(node => {
        if (activeItem === node.id) goBackFromItem();
        else if (node.level === 1) focusOnCategory(node);
        else if (node.level === 2 && !activeItem) focusOnItem(node);
      })
      
      .onBackgroundClick(() => {
        // 注: アイテム単体表示時は overlay がクリックを受け止めるため、ここは呼ばれない
        if (activeCategory !== null && !activeItem) {
          activeCategory = null;
          updateVisibility();
          setInitialLayout();
          Graph.cameraPosition({ x: 0, y: 0, z: 2500 }, { x: 0, y: 0, z: 0 }, 1000);
        }
      });
    
    // オーバーレイクリックでの「戻る」処理を追加
    overlay.addEventListener('click', () => {
        if (activeItem) goBackFromItem();
    });

    const cam = Graph.camera();
    cam.fov = 20;
    cam.updateProjectionMatrix();

    // --- 初期レイアウト設定 ---
    function setInitialLayout() {
      Graph.d3Force('charge').strength(0);
      Graph.d3Force('link').distance(0);

      const mainNode = nodes.find(n => n.id === "root");
      mainNode.fx = 0; mainNode.fy = 0; mainNode.fz = 0;

      const categoryNodes = nodes.filter(n => n.level === 1);
      const radius = 450; // 少し広げる
      const angleStep = (2 * Math.PI) / categoryNodes.length;

      categoryNodes.forEach((node, idx) => {
        node.fx = radius * Math.cos(idx * angleStep);
        node.fy = radius * Math.sin(idx * angleStep);
        node.fz = 0;
      });
    }

    setInitialLayout();
    updateVisibility();
    Graph.cameraPosition({ z: 2500 });

    // --- 表示・非表示のロジック ---
    function updateVisibility() {
      Graph.nodeVisibility(node => {
        if (activeItem) return node.id === activeItem;
        if (!activeCategory) return node.level < 2;
        return node.id === activeCategory || node.parentId === activeCategory;
      });
      
      Graph.linkVisibility(link => {
        if (activeItem) return false; 
        if (!activeCategory) {
          const targetId = link.target.id || link.target;
          return nodes.find(n => n.id === targetId)?.level === 1;
        }
        const sourceId = link.source.id || link.source;
        return sourceId === activeCategory;
      });
    }

    // --- 文字の追従・エフェクト処理 ---
    function updateLabels() {
      nodes.forEach(node => {
        const el = labelElements[node.id];
        if (el && node.x !== undefined) {
          
          let isVisible = true;
          if (activeItem) {
            isVisible = (node.id === activeItem); 
          } else if (!activeCategory) {
             if(node.level === 2) isVisible = false;
          } else {
            if (node.id === "root") {
              isVisible = false; 
            } else if (node.id !== activeCategory && node.parentId !== activeCategory) {
              isVisible = false; 
            }
          }

          const coords = Graph.graph2ScreenCoords(node.x, node.y, node.z);
          // 画面外判定を少し緩くして、見切れ際でパッと消えるのを防ぐ
          if (!isVisible || coords.z < 0 || coords.x < -100 || coords.x > window.innerWidth + 100 || coords.y < -100 || coords.y > window.innerHeight + 100) {
            el.style.opacity = 0;
            el.style.pointerEvents = 'none';
            el.classList.remove('focused-item');
          } else {
            el.style.opacity = 1; 
            el.style.pointerEvents = 'auto'; 
            el.style.left = `${coords.x}px`;
            el.style.top = `${coords.y}px`;
            
            if (activeItem && node.id === activeItem) {
              el.classList.add('focused-item');
            } else {
              el.classList.remove('focused-item');
            }
          }
        }
      });
      requestAnimationFrame(updateLabels);
    }
    requestAnimationFrame(updateLabels);
  </script>
</body>
</html>
