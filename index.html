<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Mashiro Akihito - Professional Universe</title>
  <script src="https://unpkg.com/3d-force-graph"></script>
  <style>
    body { margin: 0; background-color: #010101; overflow: hidden; font-family: "Helvetica Neue", Arial, sans-serif; }
    #guide { position: absolute; bottom: 20px; width: 100%; text-align: center; color: rgba(255,255,255,0.5); pointer-events: none; font-size: 12px; z-index: 30; }
    
    /* 確実に表示されるHTMLテキストのスタイル */
    #labels-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
    .node-label {
      position: absolute;
      transform: translate(-50%, -50%);
      font-weight: bold;
      text-shadow: 0px 0px 4px #000, 0px 0px 8px #000; /* 文字を読みやすくする黒フチ */
      white-space: nowrap;
    }
    /* 階層ごとの文字サイズと透明度 */
    .label-level-0 { font-size: 36px; color: #ffffff; z-index: 3; }
    .label-level-1 { font-size: 20px; z-index: 2; }
    .label-level-2 { font-size: 12px; opacity: 0.7; z-index: 1; }
  </style>
</head>
<body>
  <div id="guide">左クリックで回転 / 右クリックで並行移動 / ホイールでズーム / 球体クリックでフォーカス</div>
  <div id="3d-graph"></div>
  <div id="labels-container"></div>

  <script>
    const dataSet = {
      main: "Mashiro Akihito",
      categories: [
        { name: "データ分析・技術", items: ["BigQuery", "GA4", "SQL", "Looker", "ダッシュボード作成", "LookMLチューニング", "データマート設計", "パイプライン構築", "一貫した実装", "統計学"] },
        { name: "キャリア・ビジネス", items: ["社会インフラへの貢献", "ECコマース領域", "会計クラウドサービス", "長期的な価値提供", "一気通貫スタイル", "事業成長の加速", "転職・新たな挑戦", "業界の変革", "価値の最大化", "リーダーシップ"] },
        { name: "AI・先端技術", items: ["AI技術の掛け合わせ", "業務自動化", "生成AI活用", "データドリブン", "最新テックトレンド", "プロトタイプ開発", "効率化の追求", "エンジニアリング", "AIとの共生", "ディープラーニング"] },
        { name: "資産形成・投資", items: ["NVIDIA株", "株式投資", "NISA活用", "ポートフォリオ管理", "FP3級の勉強", "金融リテラシー", "経済ニュース", "資産の最適化", "リスク管理", "ふるさと納税"] },
        { name: "ライフマネジメント", items: ["銀行名義変更", "各種手続きの完遂", "生活基盤の整理", "行政対応", "整理整頓", "宝くじの夢", "日常のタスク管理", "ライフイベント", "スケジュール最適化", "パスワード管理"] },
        { name: "健康・ライフスタイル", items: ["健康的な食事", "自炊習慣", "スキンケア", "美容へのこだわり", "メンタルヘルス", "モーニングルーティン", "睡眠の質の向上", "自己研鑽", "体調管理", "マインドフルネス"] },
        { name: "エンタメ・趣味", items: ["AKB48", "B'z", "日本のポップカルチャー", "音楽鑑賞", "ライブへの情熱", "アイドル文化", "邦楽トレンド", "リラックスタイム", "多趣味な日常", "映画鑑賞"] },
        { name: "専門的ソフトスキル", items: ["UI/UX改善", "ユーザー理解", "課題解決能力", "ロジカルシンキング", "プロジェクト管理", "ドキュメント作成", "プレゼンテーション", "チーム連携", "分析的思考", "交渉力"] },
        { name: "価値観・マインドセット", items: ["誠実な貢献", "自律的な行動", "高い好奇心", "柔軟な思考", "改善マインド", "プロフェッショナリズム", "本質志向", "持続可能な成長", "知的な探求", "継続力"] },
        { name: "未来への展望", items: ["目標の達成", "スキルの成熟", "豊かな人生の構築", "安定と挑戦の両立", "新しいコミュニティ", "影響力の拡大", "幸福の追求", "未来の自分への投資", "次なるマイルストーン", "社会貢献", "新たなステージ"] }
      ]
    };

    const nodes = [{ id: "root", name: dataSet.main, val: 120, level: 0, color: "#ffffff" }];
    const links = [];
    const colors = ["#FF3366", "#33FF99", "#3366FF", "#FFCC33", "#FF66FF", "#33FFFF", "#FFA500", "#9966FF", "#CCFF33", "#FF4500"];

    // データからノードとリンクを作成
    dataSet.categories.forEach((cat, gIdx) => {
      const catId = `cat-${gIdx}`;
      const groupColor = colors[gIdx % colors.length];
      nodes.push({ id: catId, name: cat.name, val: 60, level: 1, color: groupColor });
      links.push({ source: "root", target: catId });

      cat.items.forEach((item, iIdx) => {
        const itemId = `item-${gIdx}-${iIdx}`;
        nodes.push({ id: itemId, name: item, val: 15, level: 2, color: groupColor });
        links.push({ source: catId, target: itemId });
      });
    });

    // --- HTMLテキストの生成（全101個） ---
    const labelsContainer = document.getElementById('labels-container');
    const labelElements = {};

    nodes.forEach(node => {
      const div = document.createElement('div');
      div.className = `node-label label-level-${node.level}`;
      div.innerText = node.name;
      if (node.level > 0) div.style.color = node.color; // カテゴリとアイテムに色をつける
      labelsContainer.appendChild(div);
      labelElements[node.id] = div;
    });

    // --- 3Dグラフの描画 ---
    const Graph = ForceGraph3D()(document.getElementById('3d-graph'))
      .graphData({ nodes, links })
      .nodeColor('color')
      .nodeVal('val')
      .nodeOpacity(0.9)
      .linkOpacity(0.15)
      .backgroundColor('#010101')
      .showNavInfo(false)
      // クリックズーム機能
      .onNodeClick(node => {
        const distance = 200;
        const distRatio = 1 + distance / Math.hypot(node.x, node.y, node.z);
        Graph.cameraPosition(
          { x: node.x * distRatio, y: node.y * distRatio, z: node.z * distRatio },
          node, 1000
        );
      });

    // 距離の調整（中心は遠く、カテゴリの周りは近くに配置）
    Graph.d3Force('charge').strength(-400);
    Graph.d3Force('link').distance(link => {
      // link.sourceがroot(中心)の場合は距離を150、それ以外(カテゴリ→アイテム)は60
      return link.source.id === "root" || link.source === "root" ? 150 : 60;
    });
    
    // 初期カメラ位置
    Graph.cameraPosition({ z: 1000 });

    // --- 文字を球体に追従させる処理 ---
    function updateLabels() {
      nodes.forEach(node => {
        const el = labelElements[node.id];
        if (el && node.x !== undefined) {
          const coords = Graph.graph2ScreenCoords(node.x, node.y, node.z);
          // カメラの裏に回ったら文字を隠す
          if (coords.z < 0 || coords.z > 1) {
            el.style.display = 'none';
          } else {
            el.style.display = 'block';
            el.style.left = `${coords.x}px`;
            // 球体のサイズに合わせて文字を上にずらす
            const yOffset = node.level === 0 ? 40 : (node.level === 1 ? 25 : 12);
            el.style.top = `${coords.y - yOffset}px`;
          }
        }
      });
      requestAnimationFrame(updateLabels);
    }
    requestAnimationFrame(updateLabels);
  </script>
</body>
</html>
