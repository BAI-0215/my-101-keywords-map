<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Mashiro Akihito - 3D Universe</title>
  <script src="https://unpkg.com/3d-force-graph"></script>
  <style>
    body { margin: 0; background-color: #010101; overflow: hidden; font-family: sans-serif; }
    #info { position: absolute; top: 10px; left: 10px; z-index: 20; color: white; opacity: 0.8; font-size: 12px; pointer-events: none; }
    
    /* 3D空間の手前に重ねる文字のスタイル */
    #labels-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
    .node-label {
      position: absolute;
      transform: translate(-50%, -50%);
      font-weight: bold;
      text-shadow: 0px 0px 5px #000, 0px 0px 8px #000; /* 黒のフチドリで読みやすく */
      transition: opacity 0.1s;
    }
    .label-main { font-size: 24px; color: #ffffff; }
    .label-cat { font-size: 14px; }
  </style>
</head>
<body>
  <div id="info">Drag to move & fix | 101 Keywords</div>
  <div id="3d-graph"></div>
  <div id="labels-container"></div>

  <script>
    const dataSet = {
      main: "Mashiro Akihito",
      categories: [
        { name: "データ分析・技術", items: ["BigQuery", "GA4", "SQL", "Looker", "ダッシュボード作成", "LookMLチューニング", "データマート設計", "パイプライン構築", "一貫した実装", "統計学"] },
        { name: "キャリア・ビジネス", items: ["社会インフラへの貢献", "ECコマース領域", "会計クラウドサービス", "長期的な価値提供", "一気通貫スタイル", "事業成長の加速", "転職・新たな挑戦", "業界の変革", "価値の最大化", "リーダーシップ"] },
        { name: "AI・先端技術", items: ["AI技術の掛け合わせ", "業務自動化", "生成AI活用", "データドリブン", "最新テックトレンド", "プロトタイプ開発", "効率化の追求", "エンジニアリング", "AIとの共生", "ディープラーニング"] },
        { name: "資産形成・投資", items: ["NVIDIA株", "株式投資", "NISA活用", "ポートフォリオ管理", "FP3級の勉強", "金融リテラシー", "経済ニュース", "資産の最適化", "リスク管理", "ふるさと納税"] },
        { name: "ライフマネジメント", items: ["銀行名義変更", "各種手続きの完遂", "生活基盤の整理", "行政対応", "整理整頓", "宝くじの夢", "日常のタスク管理", "ライフイベント", "スケジュール最適化", "パスワード管理"] },
        { name: "健康・ライフスタイル", items: ["健康的な食事", "自炊習慣", "スキンケア", "美容へのこだわり", "メンタルヘルス", "モーニングルーティン", "睡眠の質の向上", "自己研鑽", "体調管理", "マインドフルネス"] },
        { name: "エンタメ・趣味", items: ["AKB48", "B'z", "日本のポップカルチャー", "音楽鑑賞", "ライブへの情熱", "アイドル文化", "邦楽トレンド", "リラックスタイム", "多趣味な日常", "映画鑑賞"] },
        { name: "専門的ソフトスキル", items: ["UI/UX改善", "ユーザー理解", "課題解決能力", "ロジカルシンキング", "プロジェクト管理", "ドキュメント作成", "プレゼンテーション", "チーム連携", "分析的思考", "交渉力"] },
        { name: "価値観・マインドセット", items: ["誠実な貢献", "自律的な行動", "高い好奇心", "柔軟な思考", "改善マインド", "プロフェッショナリズム", "本質志向", "持続可能な成長", "知的な探求", "継続力"] },
        { name: "2026年と未来への展望", items: ["目標の達成", "スキルの成熟", "豊かな人生の構築", "安定と挑戦の両立", "新しいコミュニティ", "影響力の拡大", "幸福の追求", "未来の自分への投資", "次なるマイルストーン", "社会貢献", "新たなステージ"] }
      ]
    };

    const nodes = [];
    const links = [];
    const colors = ["#ff5f5f", "#5fff5f", "#5f5fff", "#ffff5f", "#ff5fff", "#5fffff", "#ffaf5f", "#af5fff", "#5fffaf", "#ff5faf"];

    // 1. mainノード（サイズ特大）
    nodes.push({ id: "root", name: dataSet.main, val: 200, level: 0, color: "#ffffff" });

    // 2. カテゴリーとアイテムの追加
    dataSet.categories.forEach((cat, gIdx) => {
      const catId = `cat-${gIdx}`;
      const groupColor = colors[gIdx % colors.length];
      
      // カテゴリーノード（サイズ大）
      nodes.push({ id: catId, name: cat.name, val: 80, level: 1, color: groupColor });
      links.push({ source: "root", target: catId });

      // アイテムノード（サイズ小）
      cat.items.forEach((item, iIdx) => {
        const itemId = `item-${gIdx}-${iIdx}`;
        nodes.push({ id: itemId, name: item, val: 15, level: 2, color: groupColor });
        links.push({ source: catId, target: itemId });
      });
    });

    // --- HTMLラベルの準備 ---
    const labelsContainer = document.getElementById('labels-container');
    const labelElements = {};

    nodes.forEach(node => {
      // main(0)とカテゴリー(1)の時だけHTMLのdivタグを作成
      if (node.level < 2) {
        const div = document.createElement('div');
        div.className = `node-label ${node.level === 0 ? 'label-main' : 'label-cat'}`;
        div.innerText = node.name;
        if (node.level === 1) div.style.color = node.color; // カテゴリはノードと同色
        labelsContainer.appendChild(div);
        labelElements[node.id] = div;
      }
    });

    // --- グラフの描画 ---
    const Graph = ForceGraph3D()(document.getElementById('3d-graph'))
      .graphData({ nodes, links })
      .nodeVal('val')
      .nodeColor(node => node.level === 2 ? `${node.color}55` : node.color) // 末端は少し透明に
      .nodeLabel(node => node.level === 2 ? node.name : '') // 末端ノードのみホバーで名前表示
      .backgroundColor('#010101')
      .linkOpacity(0.3)
      .linkWidth(0.5)
      // ドラッグ終了時にその座標(fx, fy, fz)を固定する設定
      .onNodeDragEnd(node => {
        node.fx = node.x;
        node.fy = node.y;
        node.fz = node.z;
      });

    // 広がり方の設定
    Graph.d3Force('charge').strength(-350);
    Graph.cameraPosition({ z: 600 });

    // --- ラベルを3D空間の動きに追従させる処理 ---
    function updateLabels() {
      nodes.forEach(node => {
        if (node.level < 2 && labelElements[node.id] && node.x !== undefined) {
          // 3Dの座標を、画面上の2DのX・Y座標に変換
          const coords = Graph.graph2ScreenCoords(node.x, node.y, node.z);
          const el = labelElements[node.id];
          
          // カメラの裏側に回った時は文字を消す（めり込み防止）
          if (coords.z < 0 || coords.z > 1) {
            el.style.opacity = 0;
          } else {
            el.style.opacity = 1;
            el.style.left = `${coords.x}px`;
            // 球体の少し上に文字が来るようにY座標を調整
            const yOffset = node.level === 0 ? 40 : 25;
            el.style.top = `${coords.y - yOffset}px`;
          }
        }
      });
      requestAnimationFrame(updateLabels); // 毎フレーム更新
    }
    
    // 追従処理スタート
    requestAnimationFrame(updateLabels);
  </script>
</body>
</html>
