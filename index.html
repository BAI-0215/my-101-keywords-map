<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Mashiro Akihito - 3D Universe 101</title>
  <script src="https://unpkg.com/3d-force-graph"></script>
  <style>
    body { margin: 0; background-color: #010101; overflow: hidden; }
    #info { position: absolute; top: 10px; left: 10px; z-index: 10; color: white; opacity: 0.5; font-size: 10px; pointer-events: none; }
  </style>
</head>
<body>
  <div id="info">Drag to move | Items: 101</div>
  <div id="3d-graph"></div>

  <script>
    // --- 101個のキーワードデータ (末端だけで101個) ---
    const dataSet = {
      main: "Mashiro Akihito",
      categories: [
        { name: "データ分析・技術", items: ["BigQuery", "GA4", "SQL", "Looker", "ダッシュボード作成", "LookMLチューニング", "データマート設計", "パイプライン構築", "一貫した実装", "統計学"] },
        { name: "キャリア・ビジネス", items: ["社会インフラへの貢献", "ECコマース領域", "会計クラウドサービス", "長期的な価値提供", "一気通貫スタイル", "事業成長の加速", "転職・新たな挑戦", "業界の変革", "価値の最大化", "リーダーシップ"] },
        { name: "AI・先端技術", items: ["AI技術の掛け合わせ", "業務自動化", "生成AI活用", "データドリブン", "最新テックトレンド", "プロトタイプ開発", "効率化の追求", "エンジニアリング", "AIとの共生", "ディープラーニング"] },
        { name: "資産形成・投資", items: ["NVIDIA株", "株式投資", "NISA活用", "ポートフォリオ管理", "FP3級の勉強", "金融リテラシー", "経済ニュース", "資産の最適化", "リスク管理", "ふるさと納税"] },
        { name: "ライフマネジメント", items: ["銀行名義変更", "各種手続きの完遂", "生活基盤の整理", "行政対応", "整理整頓", "宝くじの夢", "日常のタスク管理", "ライフイベント", "スケジュール最適化", "パスワード管理"] },
        { name: "健康・ライフスタイル", items: ["健康的な食事", "自炊習慣", "スキンケア", "美容へのこだわり", "メンタルヘルス", "モーニングルーティン", "睡眠の質の向上", "自己研鑽", "体調管理", "マインドフルネス"] },
        { name: "エンタメ・趣味", items: ["AKB48", "B'z", "日本のポップカルチャー", "音楽鑑賞", "ライブへの情熱", "アイドル文化", "邦楽トレンド", "リラックスタイム", "多趣味な日常", "映画鑑賞"] },
        { name: "専門的ソフトスキル", items: ["UI/UX改善", "ユーザー理解", "課題解決能力", "ロジカルシンキング", "プロジェクト管理", "ドキュメント作成", "プレゼンテーション", "チーム連携", "分析的思考", "交渉力"] },
        { name: "価値観・マインドセット", items: ["誠実な貢献", "自律的な行動", "高い好奇心", "柔軟な思考", "改善マインド", "プロフェッショナリズム", "本質志向", "持続可能な成長", "知的な探求", "継続力"] },
        { name: "2026年と未来への展望", items: ["目標の達成", "スキルの成熟", "豊かな人生の構築", "安定と挑戦の両立", "新しいコミュニティ", "影響力の拡大", "幸福の追求", "未来の自分への投資", "次なるマイルストーン", "社会貢献", "ライフワークバランス"] }
      ]
    };

    // 101個にするため、最後のカテゴリーに1つ追加して調整
    dataSet.categories[9].items.push("新たなステージ");

    const nodes = [{ id: "root", name: dataSet.main, val: 300, level: 0, color: "#ffffff" }];
    const links = [];
    const colors = ["#ff5f5f", "#5fff5f", "#5f5fff", "#ffff5f", "#ff5fff", "#5fffff", "#ffaf5f", "#af5fff", "#5fffaf", "#ff5faf"];

    dataSet.categories.forEach((cat, gIdx) => {
      const catId = `cat-${gIdx}`;
      const groupColor = colors[gIdx % colors.length];
      nodes.push({ id: catId, name: cat.name, val: 150, level: 1, color: groupColor });
      links.push({ source: "root", target: catId });

      cat.items.forEach((item, iIdx) => {
        const itemId = `item-${gIdx}-${iIdx}`;
        nodes.push({ id: itemId, name: item, val: 20, level: 2, color: groupColor });
        links.push({ source: catId, target: itemId });
      });
    });

    // 文字を画像として生成する関数 (安定性のための自作関数)
    function createTextLabel(text, color, size) {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = 256;
      canvas.height = 64;
      ctx.font = `${size}px sans-serif`;
      ctx.fillStyle = color;
      ctx.textAlign = 'center';
      ctx.fillText(text, 128, 48);
      
      const texture = new THREE.CanvasTexture(canvas);
      const spriteMaterial = new THREE.SpriteMaterial({ map: texture });
      const sprite = new THREE.Sprite(spriteMaterial);
      sprite.scale.set(40, 10, 1);
      return sprite;
    }

    const Graph = ForceGraph3D()
      (document.getElementById('3d-graph'))
        .graphData({ nodes, links })
        .nodeLabel('name')
        .nodeVal(node => node.val)
        .nodeColor(node => node.level === 2 ? `${node.color}44` : node.color)
        .nodeThreeObject(node => {
          if (node.level < 2) {
            // mainとcategoryのみ名前を表示
            const label = createTextLabel(node.name, node.color, node.level === 0 ? 40 : 32);
            label.position.y = node.level === 0 ? 20 : 15;
            return label;
          }
          return false;
        })
        .nodeThreeObjectExtend(true)
        .linkOpacity(0.2)
        .backgroundColor('#010101');

    // 自由移動のための重力設定
    Graph.d3Force('center').
